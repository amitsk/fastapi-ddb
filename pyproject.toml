[project]
name = "skilifts-demo-api"
description = "Demo CRUD API for the SkiLifts DynamoDB table"
readme = "README.md"
keywords = ["fastapi", "dynamodb", "demo"]
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "fastapi",
    "pydantic-settings",
    "boto3",
    "uvicorn",
]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "moto[dynamodb]",
    "httpx2",
    "ruff",
    "ty",
    "pre-commit",
]


[tool.ruff]
# https://docs.astral.sh/ruff/rules/
lint.select = [
    "F",   # Pyflakes
    "E",   # pycodestyle Error
    "W",   # pycodestyle Warning
    "C90", # mccabe
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C40", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "EM",  # flake8-errmsg
    "EXE", # flake8-executable
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PGH", # pygrep-hooks
    "PL",  # Pylint
    "TRY", # tryceratops
    "RUF", # Ruff-specific rules
]

lint.unfixable = ["B"]

# Exclude a variety of commonly ignored directories.
lint.exclude = [
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "venv",
]

# Never enforce line length violations. N815: the domain model uses PascalCase
# attribute names such as VerticalFeet. EM101/EM102/TRY003: domain exceptions
# carry the literal messages fixed by the spec.
lint.ignore = ["E501", "N815", "EM101", "EM102", "TRY003"]

# Always generate Python 3.14 compatible code.
target-version = "py314"

# Same as Black.
line-length = 88


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"tests/**" = [
    "S101",    # assert is how pytest works
    "S105",    # hardcoded AWS access key ids in fixtures
    "S106",    # hardcoded AWS secret access keys in fixtures
    "ANN",     # type annotations are optional in tests
    "INP001",  # tests are not a package
    "PLR2004", # magic values are fine in assertions
]


[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.coverage.run]
branch = true
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true

[tool.coverage.html]
directory = "coverage_html_report"
